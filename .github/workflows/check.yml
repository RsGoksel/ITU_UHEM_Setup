name: Local safety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/uhem-proxy.sh && sh -n scripts/install-local-tools.sh
      - run: bash -n examples/cpu-check.sbatch && bash -n examples/gpu-check.sbatch
